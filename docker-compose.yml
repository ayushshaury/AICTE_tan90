version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aicte_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: aicte_verifyai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aicte_app
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/aicte_verifyai
      JWT_SECRET: aicte_verifyai_production_secret_key_2026
      AI_SERVICE_MODE: mock
      UPLOAD_DIR: ./private-uploads
      MAX_UPLOAD_MB: 20
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
